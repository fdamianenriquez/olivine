name: Setup
description: Install pnpm and Node, then install dependencies from the lockfile.
inputs:
  node-version:
    description: Node version to use. Defaults to .nvmrc.
    required: false
    default: ""
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@v6
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: ${{ inputs.node-version == '' && '.nvmrc' || '' }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
      shell: bash
